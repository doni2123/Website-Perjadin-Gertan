<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perjalanan Dinas | WebGIS</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""><link rel="stylesheet" href="./style.css"></head><body><header><h1>Perjalanan Dinas</h1><button id="login-toggle">Login anggota</button></header><main><section class="intro"><h2>Rekapan kegiatan lapangan</h2><p>Kegiatan yang telah disetujui untuk dipublikasikan.</p><div class="stats"><b><span id="stat-total">—</span> kegiatan</b><b><span id="stat-year">—</span> tahun aktif</b><b><span id="stat-people">—</span> penugasan</b></div></section><section class="filters"><label>Tahun<select id="filter-year"><option value="">Semua tahun</option></select></label><label>Jenis<select id="filter-type"><option value="">Semua jenis</option><option value="tanggap_darurat">Tanggap darurat</option><option value="pemetaan">Pemetaan</option><option value="survei">Survei</option><option value="lainnya">Lainnya</option></select></label><label class="search">Cari<input id="filter-search" placeholder="Lokasi atau kegiatan"></label></section><p id="status">Memuat data…</p><div id="map"></div><p class="note">Peta © OpenStreetMap contributors</p><h2>Detail kegiatan <small id="result-count"></small></h2><div id="activity-list" class="cards"></div><section id="auth-panel" hidden><h2>Area anggota</h2><form id="login-form"><label>Email<input name="email" type="email" required></label><label>Kata sandi<input name="password" type="password" minlength="10" required></label><button>Masuk</button></form><p id="auth-status"></p><button id="logout" hidden>Keluar</button><form id="activity-form" hidden><input name="id" type="hidden"><label>Judul<input name="title" required maxlength="160"></label><label>Jenis<select name="activity_type"><option value="tanggap_darurat">Tanggap darurat</option><option value="pemetaan">Pemetaan</option><option value="survei">Survei</option><option value="lainnya">Lainnya</option></select></label><label>Lokasi<input name="location_name" required></label><label>Lintang<input name="latitude" type="number" min="-90" max="90" step="any" required></label><label>Bujur<input name="longitude" type="number" min="-180" max="180" step="any" required></label><label>Mulai<input name="start_date" type="date" required></label><label>Selesai<input name="end_date" type="date" required></label><label>Ringkasan<textarea name="summary" maxlength="2000" required></textarea></label><label>Anggota<select id="member-select" name="member_ids" multiple></select><small>Ctrl/Command untuk memilih beberapa anggota.</small></label><button>Simpan</button><button id="cancel-edit" type="button" hidden>Batal</button></form></section></main><footer>Hanya data kegiatan yang disetujui ditampilkan untuk publik.</footer><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script>document.getElementById("login-toggle").addEventListener("click",function(){const p=document.getElementById("auth-panel");p.hidden=!p.hidden;if(!p.hidden)p.scrollIntoView({behavior:"smooth"});});</script><script type="module" src="./app.js"></script></body></html>
